# talaria-flutter-web
# Site file for a Flutter web build on the stock Nginx + PHP container.
# remote-install.sh writes this to sites-available/default and replaces
# __PUBLIC_ROOT__ with the container public directory.

server {
    listen 80 default_server;
    server_name _;
    root __PUBLIC_ROOT__;
    index index.html;

    # The public path is a symlink that flips on each deploy.
    open_file_cache off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location = /flutter_service_worker.js {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        return 404;
    }

    location ~* \.wasm$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        default_type application/wasm;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|main\.dart\.js)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* FontManifest[^/]*\.json$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* /fonts/[^/]+\.(otf|ttf|woff2?)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.[0-9a-f]{8,}\.[A-Za-z0-9]+$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(js|json|otf|ttf|woff2?|png|jpe?g|gif|svg|ico|bin|css)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
