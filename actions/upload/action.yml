name: Upload Flutter web release
description: Rsync a prepared Flutter web build to releases/<sha> on the SiteHost container.
author: Talaria
branding:
  icon: upload
  color: blue
inputs:
  package_path:
    description: Flutter package directory, relative to the caller repository.
    required: true
    default: "."
runs:
  using: composite
  steps:
    - name: Upload
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package_path }}
      run: |
        set -euo pipefail
        root="${GITHUB_WORKSPACE:-$(pwd)}"
        case "$PACKAGE_PATH" in
          /*) export BUILD_DIR="${PACKAGE_PATH}/build/web" ;;
          *) export BUILD_DIR="${root}/${PACKAGE_PATH}/build/web" ;;
        esac
        bash "$GITHUB_ACTION_PATH/upload-release.sh"
